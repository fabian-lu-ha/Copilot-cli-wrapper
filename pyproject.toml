[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-cli-wrapper"
version = "0.1.0"
description = "Claude-Code-style CLI that drives Microsoft 365 Copilot via a persistent Edge profile."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fabian-lu-ha" }]
dependencies = [
    "playwright>=1.45",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "markdown-it-py>=3.0",
    "pygments>=2.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
copilot = "copilot_cli.cli:main"
copilot-gui = "copilot_cli.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
